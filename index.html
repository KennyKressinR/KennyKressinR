  <!-- SCRIPT PARA OBTENER FOTO DE IG AUTOMÁTICAMENTE -->
  <script>
    const igUsername = "kennykressinr"; // Cambiar si cambias tu usuario de Instagram
    const profileImg = document.getElementById("profile-img");

    async function fetchIGProfile() {
      try {
        const res = await fetch(`https://www.instagram.com/${igUsername}/?__a=1&__d=dis`);
        if(!res.ok) throw new Error("No se pudo obtener la foto de IG");
        const data = await res.json();
        // Esta ruta depende de la estructura de Instagram, puede cambiar
        const picUrl = data.graphql.user.profile_pic_url_hd;
        profileImg.src = picUrl;
      } catch(err) {
        console.log("Error al obtener la foto de IG:", err);
        profileImg.src = "https://i.imgur.com/placeholder.jpg"; // fallback
      }
    }

    fetchIGProfile();
  </script>
