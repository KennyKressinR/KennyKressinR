<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primera página en GitHub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, #ff9a9e, #fad0c4);
      color: #222;
      text-align: center;
      padding: 80px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }
    button {
      background: #222;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <h2>Bienvenido 🗣️</h2>
  <p>Empezemos a navegar!🚢⛴️</p>
  <button onclick="saludo()">Haz clic aquí</button>

  <script>
    function saludo() {
      alert("¡Gracias por visitar mi primera página en GitHub Pages!");
    }
  </script>
</body>
</html>
